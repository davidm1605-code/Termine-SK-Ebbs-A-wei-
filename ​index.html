<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UEFA Champions League 2026/27 - Live</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-color: #00d2ff;
            --live-red: #ff3333;
            --green: #238636;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--accent-color);
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .main-tabs {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 4px;
            gap: 4px;
            margin-bottom: 12px;
        }

        .main-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .main-tab.active {
            background: var(--accent-color);
            color: #000;
        }

        .status-bar {
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .controls-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .sub-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .sub-tab {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 14px;
            font-size: 12px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .sub-tab.active {
            border-color: var(--accent-color);
            color: var(--text-primary);
        }

        /* Neu: Container für Dropdown und Reset-Button nebeneinander */
        .filter-row {
            display: flex;
            gap: 8px;
        }

        .team-select {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            flex: 1;
        }

        .reset-filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .reset-filter-btn:hover {
            border-color: var(--accent-color);
            color: var(--text-primary);
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .matchday-container {
            margin-bottom: 20px;
        }

        .matchday-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px 8px 0 0;
            border-bottom: none;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2px;
            transition: all 0.2s;
            position: relative;
        }

        .match-card:last-child {
            border-radius: 0 0 8px 8px;
            margin-bottom: 0;
        }

        .match-card.live {
            border: 2px solid var(--live-red);
            animation: pulse-border 1.5s infinite;
        }

        @keyframes pulse-border {
            0% { border-color: rgba(255, 51, 51, 0.4); }
            50% { border-color: rgba(255, 51, 51, 1); }
            100% { border-color: rgba(255, 51, 51, 0.4); }
        }

        .team-side {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .team-side.home {
            justify-content: flex-end;
            text-align: right;
        }

        .team-side.away {
            justify-content: flex-start;
            text-align: left;
        }

        .team-name {
            font-size: 16px;
            font-weight: 600;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .team-logo {
            width: 30px;
            height: 30px;
            object-fit: contain;
            background-color: #ffffff;
            border-radius: 50%;
            padding: 2px;
        }

        .match-info {
            padding: 0 12px;
            text-align: center;
            min-width: 85px;
        }

        .score {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .match-status {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .match-status.live-text {
            color: var(--live-red);
            font-weight: bold;
        }

        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
            text-align: center;
        }

        th, td {
            padding: 12px 8px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 12px;
            background: rgba(255,255,255,0.02);
            text-transform: uppercase;
        }

        td.team-col {
            text-align: left;
            padding-left: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }

        .form-dots {
            display: flex;
            gap: 4px;
            justify-content: center;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot.win { background-color: var(--green); }
        .dot.loss { background-color: var(--live-red); }
        .dot.draw { background-color: var(--text-secondary); }
    </style>
</head>

    <header>
        <h1>UEFA Champions League</h1>
        
        <div class="main-tabs">
            <button class="main-tab active" onclick="switchMainTab('matches')">⚽ Spiele</button>
            <button class="main-tab" onclick="switchMainTab('table')">📊 Tabelle</button>
        </div>
        
        <div class="status-bar" id="status-bar">Live-API verbunden • Letztes Update: <span id="clock">--:--:--</span></div>
    </header>

    <!-- SPIELE SEKTION -->
    <div id="section-matches" class="section active">
        <div class="controls-container">
            <div class="sub-tabs">
                <button class="sub-tab active" onclick="filterMatches('all', event)">Alle Spiele</button>
                <button class="sub-tab" onclick="filterMatches('finished', event)">Beendet</button>
                <button class="sub-tab" onclick="filterMatches('upcoming', event)">Kommende / Live</button>
            </div>
            <!-- Geändert: Dropdown und "Alle"-Button in einer Zeile -->
            <div class="filter-row">
                <select id="team-filter" class="team-select" onchange="filterByTeam(this.value)">
                    <option value="all">🔍 Alle Mannschaften anzeigen</option>
                </select>
                <button class="reset-filter-btn" onclick="resetTeamFilter()">Alle</button>
            </div>
        </div>

        <div id="matchdays-wrapper">
            <!-- Wird dynamisch gefüllt -->
        </div>
    </div>

    <!-- TABELLE SEKTION -->
    <div id="section-table" class="section">
        <div class="table-container">
            <table>
                <thead>
                    <tr>

                        <th style="text-align: left; padding-left: 12px;">Team</th>

                        <th>U</th>
                        <th>N</th>
                        <th>Tore</th>
                        <th>Diff</th>
                        <th>Pkt</th>
                        <th>Letzte Form</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Wird dynamisch berechnet -->
                </tbody>
            </table>
        </div>
    </div>

        // Befüllt das Dropdown-Menü automatisch mit allen gefundenen Mannschaften alphabetisch sortiert
        function initTeamDropdown() {
            const teamsSet = new Set();
            matchdays.forEach(md => {
                md.matches.forEach(m => {
                    teamsSet.add(m.home);
                    teamsSet.add(m.away);
                });
            });

            const sortedTeams = Array.from(teamsSet).sort();
            const selectEl = document.getElementById('team-filter');
            
            sortedTeams.forEach(team => {
                const option = document.createElement('option');
                option.value = team;
                option.textContent = team;
                selectEl.appendChild(option);
            });
        }

        async function fetchLiveScores() {
            try {
                const response = await fetch('/.netlify/functions/proxy');
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.events) {
                        data.events.forEach(event => {
                            const competition = event.competitions[0];
                            const homeComp = competition.competitors.find(c => c.homeAway === 'home');
                            const awayComp = competition.competitors.find(c => c.homeAway === 'away');
                            
                            if (!homeComp || !awayComp) return;

                            const homeTeamName = homeComp.team.shortDisplayName || homeComp.team.name;
                            const awayTeamName = awayComp.team.shortDisplayName || awayComp.team.name;
                            const homeScore = parseInt(homeComp.score);
                            const awayScore = parseInt(awayComp.score);
                            const statusType = competition.status.type.state; 
                            const detailMinutes = competition.status.displayClock;

                            matchdays.forEach(md => {
                                md.matches.forEach(m => {
                                    const matchHomeLower = m.home.toLowerCase();
                                    const matchAwayLower = m.away.toLowerCase();
                                    const apiHomeLower = homeTeamName.toLowerCase();
                                    const apiAwayLower = awayTeamName.toLowerCase();

                                    if ((matchHomeLower.includes(apiHomeLower) || apiHomeLower.includes(matchHomeLower)) && 
                                        (matchAwayLower.includes(apiAwayLower) || apiAwayLower.includes(matchAwayLower))) {
                                        
                                        if (!isNaN(homeScore)) m.homeScore = homeScore;
                                        if (!isNaN(awayScore)) m.awayScore = awayScore;

                                        if (statusType === 'in') {
                                            m.live = true;
                                            m.liveTime = detailMinutes ? detailMinutes + "'" : '';
                                            m.status = "LIVE";
                                        } else if (statusType === 'post') {
                                            m.live = false;
                                            m.status = "Endstand";
                                        }
                                    }
                                });
                            });
                        });
                    }
                }
                document.getElementById('clock').innerText = new Date().toLocaleTimeString();
            } catch (error) {
                console.error("Fehler beim Abrufen der Live-Daten:", error);
                document.getElementById('clock').innerText = new Date().toLocaleTimeString();
            }
        }

        function calculateStandings() {
            const tableMap = {};

            matchdays.forEach(md => {
                md.matches.forEach(m => {
                    [m.home, m.away].forEach(team => {
                        if (!tableMap[team]) {
                            tableMap[team] = { team: team, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0, pts: 0, form: [] };
                        }
                    });

                    if (m.homeScore !== null && m.awayScore !== null && !m.live) {
                        const hTeam = tableMap[m.home];
                        const aTeam = tableMap[m.away];

                        hTeam.played++;
                        aTeam.played++;

                        hTeam.gf += m.homeScore;
                        hTeam.ga += m.awayScore;
                        aTeam.gf += m.awayScore;
                        aTeam.ga += m.homeScore;

                        if (m.homeScore > m.awayScore) {
                            hTeam.won++;
                            hTeam.pts += 3;
                            hTeam.form.push('win');
                            aTeam.lost++;
                            aTeam.form.push('loss');
                        } else if (m.homeScore < m.awayScore) {
                            aTeam.won++;
                            aTeam.pts += 3;
                            aTeam.form.push('win');
                            hTeam.lost++;
                            hTeam.form.push('loss');
                        } else {
                            hTeam.drawn++;
                            hTeam.pts += 1;
                            hTeam.form.push('draw');
                            aTeam.drawn++;
                            aTeam.pts += 1;
                            aTeam.form.push('draw');
                        }
                    }
                });
            });

            let standingsArr = Object.values(tableMap);
            standingsArr.sort((a, b) => {
                if (b.pts !== a.pts) return b.pts - a.pts;
                const diffA = a.gf - a.ga;
                const diffB = b.gf - b.ga;
                if (diffB !== diffA) return diffB - diffA;
                return b.gf - a.gf;
            });

            standingsArr.forEach((row, index) => {
                row.rank = index + 1;
            });

            return standingsArr;
        }

        async function renderApp() {
            await fetchLiveScores();

            const wrapper = document.getElementById('matchdays-wrapper');
            wrapper.innerHTML = '';

            matchdays.forEach(md => {
                let mdDiv = document.createElement('div');
                mdDiv.className = 'matchday-container';
                
                let html = `<div class="matchday-title">${md.day}</div>`;
                let visibleMatchCount = 0;
                
                md.matches.forEach(m => {
                    const hasResult = (m.homeScore !== null && m.awayScore !== null);
                    const isFinished = hasResult && !m.live && m.status === "Endstand";
                    const isUpcoming = !hasResult || m.live;

                    // Filter nach Status (Alle, Beendet, Kommende/Live)
                    let matchesStatusFilter = (currentFilter === 'all') || 
                                              (currentFilter === 'finished' && isFinished) || 
                                              (currentFilter === 'upcoming' && isUpcoming);

                    // Filter nach Mannschaft (falls eine ausgewählt wurde)
                    let matchesTeamFilter = (selectedTeam === 'all') || 
                                            (m.home === selectedTeam || m.away === selectedTeam);

                    let showCard = matchesStatusFilter && matchesTeamFilter;

                    if (showCard) visibleMatchCount++;

                    const isLive = m.live;
                    let statusText = '';
                    if (isLive) {
                        statusText = `<span class="match-status live-text">LIVE ${m.liveTime || ''}</span>`;
                    } else if (hasResult) {
                        statusText = `<span class="match-status">${m.status || 'Endstand'}</span>`;
                    } else {
                        const dateTimeString = (m.date ? m.date + ' ' : '') + (m.time ? m.time + ' Uhr' : '');
                        statusText = `<span class="match-status">${dateTimeString}</span>`;
                    }

                    const scoreText = hasResult ? `${m.homeScore} - ${m.awayScore}` : 'vs';

                    html += `
                        <div class="match-card ${isLive ? 'live' : ''}" style="display: ${showCard ? 'flex' : 'none'};">
                            <div class="team-side home">
                                <span class="team-name">${m.home}</span>
                                <img src="${getTeamLogo(m.home)}" class="team-logo" alt="${m.home}">
                            </div>
                            <div class="match-info">
                                <div class="score">${scoreText}</div>
                                ${statusText}
                            </div>
                            <div class="team-side away">
                                <img src="${getTeamLogo(m.away)}" class="team-logo" alt="${m.away}">
                                <span class="team-name">${m.away}</span>
                            </div>
                        </div>
                    `;
                });

                mdDiv.innerHTML = html;
                if (visibleMatchCount === 0) {
                    mdDiv.style.display = 'none';
                } else {
                    mdDiv.style.display = 'block';
                }
                wrapper.appendChild(mdDiv);
            });

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            const currentStandings = calculateStandings();
            currentStandings.forEach((row) => {
                const diff = row.gf - row.ga;
                const diffStr = diff > 0 ? `+${diff}` : diff;
                
                let dotsHtml = '';
                const recentForm = row.form.slice(-5);
                recentForm.forEach(f => {
                    dotsHtml += `<span class="dot ${f}"></span>`;
                });
                if (dotsHtml === '') {
                    dotsHtml = `<span class="dot draw"></span>`;
                }
                
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.rank}</td>
                    <td class="team-col">
                        <img src="${getTeamLogo(row.team)}" class="team-logo" style="width:26px;height:26px;">
                        ${row.team}
                    </td>
                    <td>${row.played}</td>
                    <td>${row.won}</td>
                    <td>${row.drawn}</td>
                    <td>${row.lost}</td>
                    <td>${row.gf}:${row.ga}</td>
                    <td>${diffStr}</td>
                    <td><strong>${row.pts}</strong></td>
                    <td>
                        <div class="form-dots">
                            ${dotsHtml}
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function switchMainTab(tab) {
            document.querySelectorAll('.main-tab').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));

            if (tab === 'matches') {
                document.querySelector('.main-tab:nth-child(1)').classList.add('active');
                document.getElementById('section-matches').classList.add('active');
            } else {
                document.querySelector('.main-tab:nth-child(2)').classList.add('active');
                document.getElementById('section-table').classList.add('active');
            }
        }

        function filterMatches(filter, event) {
            currentFilter = filter;
            document.querySelectorAll('.sub-tab').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            renderApp();
        }

        function filterByTeam(team) {
            selectedTeam = team;
            renderApp();
        }

        // Neu: Funktion zum Zurücksetzen des Teamfilters über den "Alle"-Button
        function resetTeamFilter() {
            selectedTeam = 'all';
            document.getElementById('team-filter').value = 'all';
            renderApp();
        }

        // Beim Start einmaliges Ausfüllen des Dropdowns und erster Render-Durchlauf
        initTeamDropdown();
        renderApp();
        setInterval(renderApp, 30000);
    </script>
</body>
</html>
