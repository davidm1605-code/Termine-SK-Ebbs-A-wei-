<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK Ebbs A (Weiß) - Meisterschaftstermine</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 12px; box-sizing: border-box; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 16px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1 { font-size: 1.1rem; color: #38bdf8; text-align: center; margin-top: 0; margin-bottom: 16px; border-bottom: 2px solid #334155; padding-bottom: 10px; }
        
        .match-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .match-card.played { opacity: 0.7; border-color: #1e293b; }
        
        .match-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: #94a3b8; font-weight: bold; }
        .status-badge { background: #dc2626; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: bold; text-transform: uppercase; }

        .match-body { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: bold; gap: 8px; }
        
        .team { flex: 1; display: flex; align-items: center; gap: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .team.away { justify-content: flex-end; text-align: right; }
        
        .score-box { display: flex; align-items: center; gap: 4px; background: #1e293b; padding: 4px 8px; border-radius: 6px; border: 1px solid #475569; }
        .score-box input { width: 24px; height: 24px; text-align: center; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 4px; font-size: 0.8rem; }
        
        .footer-row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; border-top: 1px solid #1e293b; padding-top: 8px; }
        .match-date { font-size: 0.75rem; color: #38bdf8; }
        
        .cal-btn { background: #38bdf8; color: #0f172a; text-decoration: none; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; display: inline-flex; align-items: center; gap: 4px; }
        .cal-btn:hover { background: #0ea5e9; }

        .team-shield { width: 20px; height: 24px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.45rem; font-weight: bold; color: white; flex-shrink: 0; border-radius: 3px 3px 8px 8px; background-color: #15803d; border: 1px solid rgba(255,255,255,0.2); }
        
        .top-actions { display: flex; gap: 8px; margin-bottom: 16px; }
        .action-btn { background: #0f172a; color: #38bdf8; border: 1px solid #38bdf8; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; flex: 1; font-size: 0.75rem; text-align: center; }
        .action-btn:hover { background: #38bdf8; color: #0f172a; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SK Ebbs A (Weiß) - Meisterschaft</h1>
        
        <div class="top-actions">
            <button class="action-btn" onclick="triggerSave()" style="border-color: #22c55e; color: #22c55e;">💾 Ergebnisse Speichern</button>
        </div>

        <div id="matches-container"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDlkQPYaygg7CDYpNYfvFJUq83ylMGfAoo",
            authDomain: "sk-ebbs-u12.firebaseapp.com",
            projectId: "sk-ebbs-u12",
            storageBucket: "sk-ebbs-u12.firebasestorage.app",
            messagingSenderId: "1066194709918",
            appId: "1:1066194709918:web:e20e84524f4fc12c6a3a8f",
            measurementId: "G-Q7PZ4HCBZ6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Rohdaten der Meisterschaftsspiele SK Ebbs A (Weiß) mit echtem Datum für automatischen "Beendet"-Status
        let matches = [
            { id: 1, round: "1. Runde", home: "SK Ebbs B", away: "SK Ebbs A", dateStr: "04.09.2026", timeStr: "18:30", rawDate: "2026-09-04T18:30:00", isoDate: "20260904T183000Z", homeGoals: "", awayGoals: "" },
            { id: 2, round: "2. Runde", home: "Walchsee", away: "SK Ebbs A", dateStr: "12.09.2026", timeStr: "14:00", rawDate: "2026-09-12T14:00:00", isoDate: "20260912T140000Z", homeGoals: "", awayGoals: "" },
            { id: 3, round: "3. Runde", home: "SK Ebbs A", away: "Wörgl", dateStr: "19.09.2026", timeStr: "12:00", rawDate: "2026-09-19T12:00:00", isoDate: "20260919T120000Z", homeGoals: "", awayGoals: "" },
            { id: 4, round: "4. Runde", home: "Erl", away: "SK Ebbs A", dateStr: "25.09.2026", timeStr: "17:00", rawDate: "2026-09-25T17:00:00", isoDate: "20260925T170000Z", homeGoals: "", awayGoals: "" },
            { id: 5, round: "5. Runde", home: "SK Ebbs A", away: "Waidring", dateStr: "03.10.2026", timeStr: "11:30", rawDate: "2026-10-03T11:30:00", isoDate: "20261003T113000Z", homeGoals: "", awayGoals: "" },
            { id: 6, round: "6. Runde", home: "Schwoich", away: "SK Ebbs A", dateStr: "11.10.2026", timeStr: "14:30", rawDate: "2026-10-11T14:30:00", isoDate: "20261011T143000Z", homeGoals: "", awayGoals: "" },
            { id: 7, round: "7. Runde", home: "SK Ebbs A", away: "Niederndorf", dateStr: "17.10.2026", timeStr: "12:30", rawDate: "2026-10-17T12:30:00", isoDate: "20261017T123000Z", homeGoals: "", awayGoals: "" },
            { id: 8, round: "8. Runde", home: "SK Ebbs B", away: "St. Johann B", dateStr: "24.10.2026", timeStr: "12:00", rawDate: "2026-10-24T12:00:00", isoDate: "20261024T120000Z", homeGoals: "", awayGoals: "" },
            { id: 9, round: "9. Runde", home: "SK Ebbs A", away: "Bruckhäusl", dateStr: "29.10.2026", timeStr: "17:00", rawDate: "2026-10-29T17:00:00", isoDate: "20261029T170000Z", homeGoals: "", awayGoals: "" }
        ];

        function getTeamLogo(name) {
            return `<div class="team-shield">${name.substring(0,3).toUpperCase()}</div>`;
        }

        function createGoogleCalendarLink(m) {
            const title = encodeURIComponent(`Meisterschaft: ${m.home} vs. ${m.away}`);
            const details = encodeURIComponent(`SK Ebbs A (Weiß) Meisterschaftsspiel - ${m.round}`);
            const start = m.isoDate;
            return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${start}&details=${details}`;
        }

        function renderMatches() {
            const container = document.getElementById("matches-container");
            container.innerHTML = "";

            const now = new Date();

            // Sortierung: Anstehende Spiele oben, bereits vergangene (oder mit eingetragenem Ergebnis) unten
            const sorted = [...matches].sort((a, b) => {
                const aTime = new Date(a.rawDate).getTime();
                const bTime = new Date(b.rawDate).getTime();
                const aPlayed = (aTime < now) || (a.homeGoals !== "" && a.awayGoals !== "");
                const bPlayed = (bTime < now) || (b.homeGoals !== "" && b.awayGoals !== "");
                
                if (aPlayed === bPlayed) return aTime - bTime;
                return aPlayed ? 1 : -1; 
            });

            sorted.forEach((m) => {
                const matchTime = new Date(m.rawDate).getTime();
                const isPlayed = (matchTime < now) || (m.homeGoals !== "" && m.awayGoals !== "");
                
                const card = document.createElement("div");
                card.className = `match-card ${isPlayed ? 'played' : ''}`;
                
                card.innerHTML = `
                    <div class="match-header">
                        <span>${m.round}</span>
                        <div style="display: flex; align-items: center; gap: 6px;">
                            ${isPlayed ? '<span class="status-badge">Beendet</span>' : ''}
                            <span>${m.dateStr} - ${m.timeStr} Uhr</span>
                        </div>
                    </div>
                    <div class="match-body">
                        <div class="team">${getTeamLogo(m.home)} <span>${m.home}</span></div>
                        <div class="score-box">
                            <input type="text" data-id="${m.id}" data-type="h" value="${m.homeGoals}" oninput="updateScore(${m.id}, 'h', this.value)">
                            <span>:</span>
                            <input type="text" data-id="${m.id}" data-type="a" value="${m.awayGoals}" oninput="updateScore(${m.id}, 'a', this.value)">
                        </div>
                        <div class="team away"><span>${m.away}</span> ${getTeamLogo(m.away)}</div>
                    </div>
                    <div class="footer-row">
                        <span class="match-date">📍 Meisterschaftsspiel</span>
                        <a href="${createGoogleCalendarLink(m)}" target="_blank" class="cal-btn">📅 In Kalender</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.updateScore = function(id, type, val) {
            const match = matches.find(m => m.id === id);
            if (match) {
                if (type === 'h') match.homeGoals = val.trim();
                if (type === 'a') match.awayGoals = val.trim();
            }
        };

        async function loadData() {
            try {
                const docSnap = await getDoc(doc(db, "matchdata", "sk_ebbs_a_weiss"));
                if (docSnap.exists()) {
                    const saved = docSnap.data().matches;
                    if (saved) {
                        matches.forEach(m => {
                            const found = saved.find(s => s.id === m.id);
                            if (found) {
                                m.homeGoals = found.homeGoals ?? "";
                                m.awayGoals = found.awayGoals ?? "";
                            }
                        });
                    }
                }
            } catch (e) {
                console.error("Ladefehler:", e);
            }
            renderMatches();
        }

        window.triggerSave = async function() {
            try {
                await setDoc(doc(db, "matchdata", "sk_ebbs_a_weiss"), { matches });
                alert("Ergebnisse erfolgreich gespeichert!");
                renderMatches();
            } catch (e) {
                console.error("Speicherfehler:", e);
                alert("Fehler beim Speichern.");
            }
        };

        loadData();
    </script>
</body>
</html>
